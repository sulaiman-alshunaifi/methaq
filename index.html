<script type="text/babel" data-type="module" data-presets="react">

import React, { useState, useMemo, useEffect, useRef } from "react";
import { createRoot } from "react-dom/client";
import * as XLSX from "xlsx";
import {
  PieChart, Pie, Cell, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip,
  Legend, ResponsiveContainer, AreaChart, Area, RadialBarChart, RadialBar,
} from "recharts";
import {
  LayoutDashboard, Boxes, Users, Building2, RefreshCw, ShieldCheck, Package,
  Network, Lock, FileCheck2, FileBarChart, Settings as SettingsIcon, Search,
  Bell, Download, Sun, Moon, ChevronRight, ChevronLeft, X, Sparkles,
  ArrowUpRight, ArrowDownRight, AlertTriangle, CheckCircle2, Clock, Server,
  Laptop, Monitor, Smartphone, HardDrive, Router, Wifi, ShieldAlert,
  TrendingUp, ChevronDown, MapPin, Mail, Cpu, Upload, FileSpreadsheet,
} from "lucide-react";

/* ============================== DEFAULT DATA ============================== */
const DEFAULT_FILE_NAME = "Tuwaiq_IT_Asset_Register_Demo.xlsx";
const DEFAULT_DATA = { assets: [], employees: [], departments: [], software: [], warranty: [], network: [], maintenance: [], audits: [], procurement: [], nca: [] };

/* ============================== EXCEL PARSER ============================== */
// Column subsets kept for the two sheets we trim (mirrors the dataset's original build).
// All other sheets are read in full, column-for-column, as they appear in the workbook.
const ASSET_FIELDS = [
  "Asset ID","Asset Tag","Asset Name","Serial Number","Manufacturer","Model","Asset Category","Asset Type",
  "Assigned User","Employee ID","Department","Business Unit","Manager","Country","City","Office","Hostname","IP Address",
  "Operating System","OS Version","CPU","RAM (GB)","Storage (GB)","Purchase Date","Purchase Cost (SAR)","Current Asset Value",
  "Depreciation (%)","Warranty End","AMC End","Asset Status","Lifecycle Stage","Last Audit Date","End of Life Date",
  "Antivirus Installed","EDR Installed","Disk Encryption","Firewall Enabled","MDM Enrolled","Compliance Status",
  "Asset Health Score","Asset Criticality","CIA Rating","Risk Level",
];
const MAINTENANCE_FIELDS = ["Ticket ID","Asset ID","Issue Category","Reported Date","Resolved Date","Vendor","Cost (SAR)","Status"];

const SHEET_NAMES = {
  assets: "01_IT_Asset_Inventory",
  employees: "02_Employee_Master",
  departments: "03_Department_Master",
  software: "04_Software_Inventory",
  warranty: "05_Warranty_AMC_Tracker",
  network: "06_Network_Devices",
  maintenance: "07_Maintenance_History",
  audits: "08_Audit_History",
  procurement: "09_Vendor_Procurement",
  nca: "10_NCA_ECC_Asset_Register",
};

const pad2 = (n) => String(n).padStart(2, "0");
// Excel dates arrive as local-time Date objects (sometimes a few seconds before midnight).
// Rounding to the nearest day and reading the local calendar date keeps the exact date typed in Excel.
const toISO = (v) => {
  if (v instanceof Date && !isNaN(v)) {
    const d = new Date(v.getTime() + 12 * 60 * 60 * 1000);
    return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  }
  return v;
};

const isoifyRecord = (rec) => {
  const out = {};
  Object.keys(rec).forEach((k) => { out[k] = toISO(rec[k]); });
  return out;
};

const pickFields = (rec, fields) => {
  const out = {};
  fields.forEach((f) => { out[f] = toISO(rec[f] ?? null); });
  return out;
};

function sheetToRecords(workbook, sheetName) {
  const ws = workbook.Sheets[sheetName];
  if (!ws) return null;
  return XLSX.utils.sheet_to_json(ws, { defval: null }).map(isoifyRecord);
}

// Currency: amounts are expected in Saudi riyals (columns ending "(SAR)").
// Older files with "(USD)" columns are still accepted and converted at the official peg (1 USD = 3.75 SAR).
const USD_TO_SAR = 3.75;
const toNum = (v) => (v == null || v === "" ? null : Number(v));
function sarify(rows, pairs, extraIfUsd = []) {
  return rows.map((r) => {
    const out = { ...r };
    let usd = false;
    pairs.forEach(([usdKey, sarKey]) => {
      if (out[sarKey] == null && out[usdKey] != null) { out[sarKey] = toNum(out[usdKey]) * USD_TO_SAR; usd = true; }
      delete out[usdKey];
    });
    if (usd) extraIfUsd.forEach((k) => { if (out[k] != null) out[k] = toNum(out[k]) * USD_TO_SAR; });
    return out;
  });
}

// Builds the app's internal dataset shape from a parsed SheetJS workbook.
// Throws a descriptive error if the required asset sheet can't be found.
function buildDatasetFromWorkbook(workbook) {
  const assetsRaw = sheetToRecords(workbook, SHEET_NAMES.assets);
  if (!assetsRaw || assetsRaw.length === 0) {
    throw new Error(`تعذّر العثور على ورقة "${SHEET_NAMES.assets}" تحتوي على بيانات في هذا الملف.`);
  }
  const maintenanceRaw = sheetToRecords(workbook, SHEET_NAMES.maintenance) || [];

  return {
    assets: sarify(assetsRaw, [["Purchase Cost (USD)", "Purchase Cost (SAR)"]], ["Current Asset Value"]).map((r) => pickFields(r, ASSET_FIELDS)),
    employees: sheetToRecords(workbook, SHEET_NAMES.employees) || [],
    departments: sarify(sheetToRecords(workbook, SHEET_NAMES.departments) || [], [["Budget (USD)", "Budget (SAR)"]]),
    software: sheetToRecords(workbook, SHEET_NAMES.software) || [],
    warranty: sheetToRecords(workbook, SHEET_NAMES.warranty) || [],
    network: sheetToRecords(workbook, SHEET_NAMES.network) || [],
    maintenance: sarify(maintenanceRaw, [["Cost (USD)", "Cost (SAR)"]]).map((r) => pickFields(r, MAINTENANCE_FIELDS)),
    audits: sheetToRecords(workbook, SHEET_NAMES.audits) || [],
    procurement: sarify(sheetToRecords(workbook, SHEET_NAMES.procurement) || [], [["Purchase Cost", "Purchase Cost (SAR)"]]),
    nca: sheetToRecords(workbook, SHEET_NAMES.nca) || [],

// Recomputes values that depend on "today" so readings are always current and consistent across pages
function normalizeDataset(data) {
  const warranty = (data.warranty || []).map((w) => {
    if (!w["Warranty End"]) return w;
    const days = Math.round((new Date(w["Warranty End"]) - TODAY) / 86400000);
    if (isNaN(days)) return w;
    return { ...w, "Days Remaining": days, "Warranty Status": days < 0 ? "Expired" : days <= 90 ? "Expiring Soon" : "Active" };
  });
  return { ...data, warranty };
}

  Maintenance: { bg: "bg-amber-100 dark:bg-amber-500/15", text: "text-amber-700 dark:text-amber-400" },
  Retired: { bg: "bg-slate-200 dark:bg-slate-600/30", text: "text-slate-600 dark:text-slate-300" },
  Spare: { bg: "bg-sky-100 dark:bg-sky-500/15", text: "text-sky-700 dark:text-sky-400" },
  "In Stock": { bg: "bg-sky-100 dark:bg-sky-500/15", text: "text-sky-700 dark:text-sky-400" },
  Assigned: { bg: "bg-blue-100 dark:bg-blue-500/15", text: "text-blue-700 dark:text-blue-400" },
};
const RISK_TONES = {
  Critical: { bg: "bg-red-100 dark:bg-red-500/15", text: "text-red-700 dark:text-red-400" },
  High: { bg: "bg-orange-100 dark:bg-orange-500/15", text: "text-orange-700 dark:text-orange-400" },
  Medium: { bg: "bg-amber-100 dark:bg-amber-500/15", text: "text-amber-700 dark:text-amber-400" },
  Low: { bg: "bg-emerald-100 dark:bg-emerald-500/15", text: "text-emerald-700 dark:text-emerald-400" },
};
const COMPLIANCE_TONES = {
  Compliant: { bg: "bg-emerald-100 dark:bg-emerald-500/15", text: "text-emerald-700 dark:text-emerald-400" },
  "Non-Compliant": { bg: "bg-red-100 dark:bg-red-500/15", text: "text-red-700 dark:text-red-400" },
  Pending: { bg: "bg-amber-100 dark:bg-amber-500/15", text: "text-amber-700 dark:text-amber-400" },
};

function Badge({ value, tones, className = "" }) {
  const t = badgeTone(value, tones);
  return (
    <span className={`inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium ${t.bg} ${t.text} ${className}`}>
      {tr(value)}
    </span>
  );
}

function healthColor(score) {
  if (score >= 90) return PALETTE.success;
  if (score >= 75) return "#3B82F6";
  if (score >= 60) return PALETTE.warning;
  return PALETTE.danger;
}

/* ============================== SMALL UI PRIMITIVES ============================== */
function Card({ children, className = "", noPad = false }) {
  return (
    <div className={`bg-white dark:bg-slate-800/60 rounded-[18px] shadow-sm border border-slate-200 dark:border-slate-700/60 ${noPad ? "" : "p-5"} ${className}`}>
      {children}
    </div>
  );
}

function SectionTitle({ title, subtitle, icon: Icon }) {
  return (
    <div className="mb-4 flex items-center gap-2">
      {Icon && <Icon size={18} className="text-blue-600 dark:text-blue-400" />}
      <div>
        <h3 className="text-sm font-semibold text-slate-800 dark:text-slate-100">{title}</h3>
        {subtitle && <p className="text-xs text-slate-500 dark:text-slate-400">{subtitle}</p>}
      </div>
    </div>
  );
}

function KpiCard({ icon: Icon, label, value, trend, trendLabel, tone = "primary", suffix }) {
  const toneMap = {
    primary: "text-blue-600 bg-blue-50 dark:bg-blue-500/10 dark:text-blue-400",
    success: "text-emerald-600 bg-emerald-50 dark:bg-emerald-500/10 dark:text-emerald-400",
    warning: "text-amber-600 bg-amber-50 dark:bg-amber-500/10 dark:text-amber-400",
    danger: "text-red-600 bg-red-50 dark:bg-red-500/10 dark:text-red-400",
    info: "text-sky-600 bg-sky-50 dark:bg-sky-500/10 dark:text-sky-400",
    slate: "text-slate-600 bg-slate-100 dark:bg-slate-500/10 dark:text-slate-300",
  };
  return (
    <Card className="hover:shadow-md hover:-translate-y-0.5 transition-all duration-200 cursor-default">
      <div className="flex items-start justify-between">
        <div className={`w-9 h-9 rounded-xl flex items-center justify-center ${toneMap[tone]}`}>
          <Icon size={17} />
        </div>
        {trend != null && (
          <span className={`flex items-center gap-0.5 text-xs font-medium ${trend >= 0 ? "text-emerald-600" : "text-red-500"}`}>
            {trend >= 0 ? <ArrowUpRight size={13} /> : <ArrowDownRight size={13} />}
            {Math.abs(trend)}%
          </span>
        )}
      </div>
      <div className="mt-3 text-2xl font-semibold text-slate-800 dark:text-white tabular-nums">
        {value}
        {suffix && <span className="text-sm font-normal text-slate-400 mr-1">{suffix}</span>}
      </div>
      <div className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">{label}</div>
      {trendLabel && <div className="text-[11px] text-slate-400 mt-1">{trendLabel}</div>}
    </Card>
  );
}

function ProgressBar({ value, max = 100, color = PALETTE.primary, height = 8 }) {
  const pct = Math.min(100, (value / max) * 100);
  return (
    <div className="w-full bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden" style={{ height }}>
      <div className="h-full rounded-full transition-all duration-500" style={{ width: `${pct}%`, backgroundColor: color }} />
    </div>
  );
}

function EmptyState({ text }) {
  return <div className="text-center text-sm text-slate-400 py-10">{text}</div>;
}

/* ============================== NAV CONFIG ============================== */
const NAV_ITEMS = [
  { id: "dashboard", label: "لوحة المعلومات", icon: LayoutDashboard },
  { id: "inventory", label: "سجل الأصول", icon: Boxes },
  { id: "employees", label: "أصول الموظفين", icon: Users },
  { id: "departments", label: "لوحة الأقسام", icon: Building2 },
  { id: "lifecycle", label: "دورة حياة الأصول", icon: RefreshCw },
  { id: "warranty", label: "الضمان وعقود الصيانة", icon: Clock },
  { id: "software", label: "سجل البرمجيات", icon: Package },
  { id: "network", label: "أجهزة الشبكة", icon: Network },
  { id: "security", label: "الامتثال الأمني", icon: Lock },
  { id: "nca", label: "ضوابط NCA (ECC)", icon: FileCheck2 },
  { id: "reports", label: "التقارير", icon: FileBarChart },
  { id: "settings", label: "الإعدادات", icon: SettingsIcon },
];

/* ============================== APP ============================== */
function App() {
  const [dark, setDark] = useState(true);
  const [page, setPage] = useState("dashboard");
  const [collapsed, setCollapsed] = useState(false);
  const [globalQuery, setGlobalQuery] = useState("");
  const [selectedAsset, setSelectedAsset] = useState(null);
  const [selectedEmployee, setSelectedEmployee] = useState(null);
  const [selectedDept, setSelectedDept] = useState(null);
  const [aiOpen, setAiOpen] = useState(false);
  const [mobileNavOpen, setMobileNavOpen] = useState(false);

  /* ---------- dataset (uploadable) ---------- */
  const [DATA, setDATA] = useState(() => normalizeDataset(DEFAULT_DATA));
  const [datasetMeta, setDatasetMeta] = useState({ fileName: "لا يوجد", loadedAt: null });
  const [uploadError, setUploadError] = useState(null);
  const [uploading, setUploading] = useState(false);
  const fileInputRef = useRef(null);

  const triggerUpload = () => fileInputRef.current?.click();

  const handleFileUpload = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setUploading(true);
    setUploadError(null);
    try {
      const buffer = await file.arrayBuffer();
      const workbook = XLSX.read(buffer, { type: "array", cellDates: true });
      const nextData = buildDatasetFromWorkbook(workbook);
      setDATA(normalizeDataset(nextData));
      setDatasetMeta({ fileName: file.name, loadedAt: new Date() });
      setSelectedAsset(null); setSelectedEmployee(null); setSelectedDept(null);
      setPage("dashboard");
    } catch (err) {
      setUploadError(err?.message || "تعذّرت قراءة الملف. تأكد من مطابقته للقالب المعتمد.");
    } finally {
      setUploading(false);
      e.target.value = "";
    }
  };

  const assets = DATA.assets;

  /* ---------- global derived metrics ---------- */
  const kpis = useMemo(() => {
    const total = assets.length;
    const active = assets.filter((a) => a["Asset Status"] === "Active").length;
    const retired = assets.filter((a) => a["Asset Status"] === "Retired").length;
    const maintenance = assets.filter((a) => a["Asset Status"] === "Maintenance").length;
    const totalValue = sum(assets, "Current Asset Value");
    const avgHealth = avg(assets, "Asset Health Score");
    const compliant = assets.filter((a) => a["Compliance Status"] === "Compliant").length;
    const nonCompliant = assets.filter((a) => a["Compliance Status"] === "Non-Compliant").length;
    const warrantyExpiring30 = assets.filter((a) => {
      const d = daysUntil(a["Warranty End"]);
      return d != null && d >= 0 && d <= 30;
    }).length;
    const warrantyExpired = assets.filter((a) => {
      const d = daysUntil(a["Warranty End"]);
      return d != null && d < 0;
    }).length;
    const critical = assets.filter((a) => a["Asset Criticality"] === "Critical").length;
    const highRisk = assets.filter((a) => a["Risk Level"] === "High" || a["Risk Level"] === "Critical").length;
    return { total, active, retired, maintenance, totalValue, avgHealth, compliant, nonCompliant, warrantyExpiring30, warrantyExpired, critical, highRisk };
  }, [assets]);

  const categoryDist = useMemo(() => {
    const g = groupBy(assets, "Asset Category");
    return Object.entries(g).map(([name, items]) => ({ name, value: items.length })).sort((a, b) => b.value - a.value);
  }, [assets]);

  const deptValue = useMemo(() => {
    const g = groupBy(assets, "Department");
    return Object.entries(g)
      .map(([name, items]) => ({ name, value: Math.round(sum(items, "Current Asset Value")) }))
      .sort((a, b) => b.value - a.value);
  }, [assets]);

  const manufacturerDist = useMemo(() => {
    const g = groupBy(assets, "Manufacturer");
    return Object.entries(g).map(([name, items]) => ({ name, value: items.length })).sort((a, b) => b.value - a.value);
  }, [assets]);

  const purchaseTrend = useMemo(() => {
    const g = {};
    assets.forEach((a) => {
      if (!a["Purchase Date"]) return;
      const key = a["Purchase Date"].slice(0, 7);
      g[key] = (g[key] || 0) + 1;
    });
    return Object.entries(g).sort(([a], [b]) => a.localeCompare(b)).map(([month, count]) => ({ month, count }));
  }, [assets]);

  const lifecycleFunnel = useMemo(() => {
    const order = ["In Stock", "Assigned", "Active", "Maintenance", "Retired"];
    const g = groupBy(assets, "Lifecycle Stage");
    return order.map((stage) => ({ stage, count: (g[stage] || []).length }));
  }, [assets]);

  const insights = useMemo(() => {
    const out = [];
    const add = (text, page, cta) => out.push({ text, page, cta });
    if (kpis.warrantyExpiring30 > 0) add(`${kpis.warrantyExpiring30} أصول تحتاج إلى تجديد الضمان خلال 30 يوماً.`, "warranty", "عرض الضمانات");
    const deptCompliance = Object.entries(groupBy(assets, "Department")).map(([name, items]) => ({
      name, pct: Math.round((items.filter((i) => i["Compliance Status"] === "Compliant").length / items.length) * 100),
    })).sort((a, b) => b.pct - a.pct);
    if (deptCompliance[0]) add(`قسم ${tr(deptCompliance[0].name)} يحقق أعلى نسبة امتثال بمعدل ${deptCompliance[0].pct}%.`, "departments", "مقارنة الأقسام");
    const noBitlocker = assets.filter((a) => a["Disk Encryption"] === "Disabled" && a["Asset Category"] === "Laptop").length;
    if (noBitlocker > 0) add(`${noBitlocker} أجهزة محمولة غير ممتثلة بسبب تعطيل تشفير القرص.`, "security", "عرض الامتثال الأمني");
    const eol = assets.filter((a) => { const d = daysUntil(a["End of Life Date"]); return d != null && d < 90; }).length;
    if (eol > 0) add(`${eol} أصول وصلت أو تقترب من نهاية عمرها التشغيلي خلال 90 يوماً.`, "lifecycle", "عرض دورة الحياة");
    const noAv = assets.filter((a) => a["Antivirus Installed"] === "No").length;
    if (noAv > 0) add(`${noAv} أجهزة تعمل بدون حماية من الفيروسات.`, "security", "عرض الأجهزة غير المحمية");
    if (kpis.highRisk > 0) add(`${kpis.highRisk} أصول مصنّفة حالياً بمخاطر مرتفعة أو حرجة.`, "inventory", "فتح سجل الأصول");
    const eccGaps = (DATA.nca || []).filter((r) => r["Implementation Status"] === "Not Implemented").length;
    if (eccGaps > 0) add(`${eccGaps} ضوابط من ضوابط الهيئة الوطنية للأمن السيبراني (ECC) غير منفّذة.`, "nca", "عرض فجوات NCA");
    const expiredLic = (DATA.software || []).filter((x) => x["License Status"] === "Expired").length;
    if (expiredLic > 0) add(`${expiredLic} تراخيص برمجيات منتهية تحتاج إلى تجديد.`, "software", "عرض البرمجيات");
    return out;
  }, [assets, kpis, DATA]);

  /* ---------- global search ---------- */
  const searchResults = useMemo(() => {
    const q = normDigits(globalQuery).trim().toLowerCase();
    if (!q) return [];
    return assets.filter((a) =>
      [a["Asset ID"], a["Hostname"], a["Assigned User"], a["Department"], a["Serial Number"], a["Asset Tag"], a["Manufacturer"]]
        .filter(Boolean).some((f) => String(f).toLowerCase().includes(q))
    ).slice(0, 8);
  }, [globalQuery, assets]);

  useEffect(() => {
    document.documentElement.style.colorScheme = dark ? "dark" : "light";
  }, [dark]);

  const goToAsset = (asset) => {
    setSelectedAsset(asset);
    setPage("inventory");
    setGlobalQuery("");
  };

  return (
    <div className={dark ? "dark" : ""}>
      <div className="flex h-full min-h-[760px] bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans" style={{ fontFamily: "'SaudiRiyal', 'ArabicDigits', 'IBM Plex Sans Arabic', Inter, ui-sans-serif, system-ui, sans-serif" }}>
        {/* SIDEBAR */}
        <aside className={`${collapsed ? "w-[68px]" : "w-64"} hidden md:flex flex-col bg-slate-900 dark:bg-slate-950 text-slate-300 transition-all duration-200 shrink-0`}>
          <div className={`${collapsed ? "h-16 px-2" : "py-4 px-4"} flex items-center justify-center border-b border-slate-800 transition-all`}>
            <img src={LOGO_SRC} alt={APP_NAME} title={APP_NAME} className={`${collapsed ? "h-11" : "h-36"} w-auto object-contain transition-all drop-shadow-[0_2px_8px_rgba(212,175,55,0.25)]`} />
          </div>
          <nav className="flex-1 py-3 overflow-y-auto">
            {NAV_ITEMS.map((item) => {
              const Icon = item.icon;
              const activeItem = page === item.id;
              return (
                <button
                  key={item.id}
                  onClick={() => { setPage(item.id); setSelectedAsset(null); setSelectedEmployee(null); setSelectedDept(null); }}
                  className={`w-full flex items-center gap-3 px-4 py-2.5 text-[13px] transition-colors relative
                    ${activeItem ? "text-white bg-blue-600/15" : "text-slate-400 hover:text-white hover:bg-slate-800/60"}`}
                  title={collapsed ? item.label : undefined}
                >
                  {activeItem && <span className="absolute right-0 top-0 h-full w-[3px] bg-blue-500 rounded-l" />}
                  <Icon size={17} className="shrink-0" />
                  {!collapsed && <span className="truncate">{item.label}</span>}
                </button>
              );
            })}
          </nav>
          <div className="border-t border-slate-800 p-3">
            <button onClick={() => setCollapsed((c) => !c)} className="w-full flex items-center gap-2 px-2 py-2 text-slate-400 hover:text-white text-xs">
              {collapsed ? <ChevronLeft size={16} /> : <><ChevronRight size={16} /> طي القائمة</>}
            </button>
            {!collapsed && (
              <div className="flex items-center gap-2 px-2 py-2 mt-1">
                <div className="w-8 h-8 rounded-full bg-gradient-to-br from-blue-500 to-sky-400 flex items-center justify-center text-white text-xs font-semibold">س ش</div>
                <div className="min-w-0">
                  <div className="text-xs font-medium text-white truncate">سليمان الشنيفي</div>
                  <div className="text-[11px] text-slate-500 truncate">الحوكمة والمخاطر والتدقيق</div>
                </div>
              </div>
            )}
          </div>
        </aside>

        {/* MOBILE NAV DRAWER */}
        {mobileNavOpen && (
          <div className="fixed inset-0 z-40 md:hidden">
            <div className="absolute inset-0 bg-black/50" onClick={() => setMobileNavOpen(false)} />
            <div className="absolute right-0 top-0 bottom-0 w-64 bg-slate-900 text-slate-300 flex flex-col">
              <div className="h-16 flex items-center justify-between px-4 border-b border-slate-800">
                <div className="flex items-center gap-2"><img src={LOGO_SRC} alt={APP_NAME} className="h-12 w-auto object-contain" /><span className="font-semibold text-[#E6C77A] text-[15px]">{APP_NAME}</span></div>
                <button onClick={() => setMobileNavOpen(false)}><X size={18} /></button>
              </div>
              <nav className="flex-1 py-3 overflow-y-auto">
                {NAV_ITEMS.map((item) => {
                  const Icon = item.icon;
                  return (
                    <button key={item.id} onClick={() => { setPage(item.id); setMobileNavOpen(false); }}
                      className={`w-full flex items-center gap-3 px-4 py-2.5 text-[13px] ${page === item.id ? "text-white bg-blue-600/15" : "text-slate-400"}`}>
                      <Icon size={17} /> {item.label}
                    </button>
                  );
                })}
              </nav>
            </div>
          </div>
        )}

        {/* MAIN */}
        <div className="flex-1 flex flex-col min-w-0">
          {/* TOP NAV */}
          <header className="h-16 shrink-0 bg-white dark:bg-slate-800/60 border-b border-slate-200 dark:border-slate-700/60 flex items-center gap-3 px-4 md:px-6">
            <button className="md:hidden text-slate-500" onClick={() => setMobileNavOpen(true)}>
              <LayoutDashboard size={20} />
            </button>
            <div className="hidden md:block">
              <div className="text-sm font-semibold">أكاديمية طويق</div>
              <div className="text-[11px] text-slate-400">{PERIOD_LABEL}</div>
            </div>
            <div className="flex-1 max-w-md relative mr-2">
              <Search size={15} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400" />
              <input
                value={globalQuery}
                onChange={(e) => setGlobalQuery(e.target.value)}
                placeholder="ابحث عن الأصول أو المستخدمين أو أسماء الأجهزة…"
                className="w-full pr-9 pl-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-700/60 text-sm outline-none focus:ring-2 focus:ring-blue-500/40 placeholder:text-slate-400"
              />
              {searchResults.length > 0 && (
                <div className="absolute mt-1 w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-lg z-30 overflow-hidden">
                  {searchResults.map((a) => (
                    <button key={a["Asset ID"]} onClick={() => goToAsset(a)} className="w-full text-right px-3 py-2 hover:bg-slate-50 dark:hover:bg-slate-700/60 flex items-center justify-between text-sm">
                      <span className="truncate">{a["Asset Name"]} <span className="text-slate-400">· {a["Asset ID"]}</span></span>
                      <span className="text-xs text-slate-400">{a["Assigned User"]}</span>
                    </button>
                  ))}
                </div>
              )}
            </div>
            <button onClick={() => setAiOpen(true)} className="hidden sm:flex items-center gap-1.5 px-3 py-2 rounded-xl bg-blue-600 text-white text-xs font-medium hover:bg-blue-700 transition-colors">
              <Sparkles size={14} /> رؤى الذكاء الاصطناعي
            </button>
            <button className="relative text-slate-500 hover:text-slate-700 dark:hover:text-white p-2">
              <Bell size={18} />
              <span className="absolute top-1.5 right-1.5 w-1.5 h-1.5 rounded-full bg-red-500" />
            </button>
            <input ref={fileInputRef} type="file" accept=".xlsx,.xls" onChange={handleFileUpload} className="hidden" />
            <button onClick={triggerUpload} disabled={uploading} className="hidden sm:flex items-center gap-1.5 px-3 py-2 rounded-xl bg-emerald-600 text-white text-xs font-medium hover:bg-emerald-700 disabled:opacity-60 transition-colors">
              <Upload size={14} /> {uploading ? "جارٍ القراءة…" : "رفع البيانات"}
            </button>
            <button onClick={() => setPage("reports")} className="hidden sm:flex items-center gap-1.5 px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-600 text-xs font-medium hover:bg-slate-50 dark:hover:bg-slate-700/60">
              <Download size={14} /> تصدير
            </button>
            <button onClick={() => setDark((d) => !d)} className="p-2 rounded-xl text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700/60">
              {dark ? <Sun size={18} /> : <Moon size={18} />}
            </button>
          </header>

          {uploadError && (
            <div className="mx-4 md:mx-6 mt-3 flex items-start gap-2 px-4 py-3 rounded-xl bg-red-50 dark:bg-red-500/10 border border-red-200 dark:border-red-500/20 text-red-700 dark:text-red-400 text-sm">
              <AlertTriangle size={16} className="mt-0.5 shrink-0" />
              <div className="flex-1">
                <div className="font-medium">تعذّر تحميل الملف</div>
                <div className="text-xs mt-0.5">{uploadError}</div>
              </div>
              <button onClick={() => setUploadError(null)}><X size={15} /></button>
            </div>
          )}

          {/* PAGE BODY */}
          <main className="flex-1 overflow-y-auto p-4 md:p-6">
            {assets.length === 0 && page !== "settings" && (
              <div className="mb-5 rounded-[18px] border border-dashed border-blue-300 dark:border-blue-500/40 bg-blue-50 dark:bg-blue-500/10 p-5 flex flex-col sm:flex-row sm:items-center gap-3 justify-between">
                <div>
                  <div className="font-semibold text-blue-800 dark:text-blue-300">لا توجد بيانات بعد</div>
                  <div className="text-sm text-blue-700/80 dark:text-blue-300/80">جميع القراءات تساوي صفراً. ارفع ملف سجل الأصول (Excel) لعرض المؤشرات والتحليلات.</div>
                </div>
                <button onClick={triggerUpload} disabled={uploading} className="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium disabled:opacity-60">
                  {uploading ? "جارٍ القراءة…" : "رفع ملف سجل الأصول"}
                </button>
              </div>
            )}
            {page === "dashboard" && <DashboardPage kpis={kpis} categoryDist={categoryDist} deptValue={deptValue} manufacturerDist={manufacturerDist} purchaseTrend={purchaseTrend} lifecycleFunnel={lifecycleFunnel} onOpenAsset={goToAsset} assets={assets} />}
            {page === "inventory" && <InventoryPage assets={assets} selectedAsset={selectedAsset} setSelectedAsset={setSelectedAsset} />}
            {page === "employees" && <EmployeesPage assets={assets} employees={DATA.employees} selectedEmployee={selectedEmployee} setSelectedEmployee={setSelectedEmployee} />}

/* ============================== INVENTORY PAGE ============================== */
function InventoryPage({ assets, selectedAsset, setSelectedAsset }) {
  const [q, setQ] = useState("");
  const [dept, setDept] = useState("All");
  const [status, setStatus] = useState("All");
  const [category, setCategory] = useState("All");
  const [sortKey, setSortKey] = useState("Asset ID");
  const [sortDir, setSortDir] = useState(1);
  const [pageNum, setPageNum] = useState(1);
  const pageSize = 8;
  const [drawerTab, setDrawerTab] = useState("overview");

  const depts = ["All", ...new Set(assets.map((a) => a["Department"]))];
  const statuses = ["All", ...new Set(assets.map((a) => a["Asset Status"]))];
  const categories = ["All", ...new Set(assets.map((a) => a["Asset Category"]))];

  const filtered = useMemo(() => {
    let list = assets.filter((a) => {
      const matchesQ = !q || [a["Asset Name"], a["Asset ID"], a["Serial Number"], a["Assigned User"], a["Hostname"]].some((f) => String(f).toLowerCase().includes(normDigits(q).toLowerCase()));
      const matchesDept = dept === "All" || a["Department"] === dept;
      const matchesStatus = status === "All" || a["Asset Status"] === status;
      const matchesCat = category === "All" || a["Asset Category"] === category;
      return matchesQ && matchesDept && matchesStatus && matchesCat;
    });
    list = [...list].sort((a, b) => {
      const av = a[sortKey], bv = b[sortKey];
      if (typeof av === "number") return (av - bv) * sortDir;
      return String(av).localeCompare(String(bv)) * sortDir;
    });
    return list;
  }, [assets, q, dept, status, category, sortKey, sortDir]);

  const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
  const paged = filtered.slice((pageNum - 1) * pageSize, pageNum * pageSize);

  const cols = [
    { key: "Asset ID", label: "رقم الأصل" },
    { key: "Asset Name", label: "اسم الأصل" },
    { key: "Asset Category", label: "الفئة" },
    { key: "Department", label: "القسم" },
    { key: "Assigned User", label: "مُسند إلى" },
    { key: "Asset Status", label: "الحالة" },
    { key: "Compliance Status", label: "الامتثال" },
    { key: "Asset Health Score", label: "الصحة" },
  ];

  const toggleSort = (key) => {
    if (sortKey === key) setSortDir((d) => -d);
    else { setSortKey(key); setSortDir(1); }
  };

  const exportCsv = () => {
    if (!assets.length) return;
    const headers = Object.keys(assets[0]);
    const rows = filtered.map((a) => headers.map((h) => `"${a[h] ?? ""}"`).join(","));
    const csv = [headers.join(","), ...rows].join("\n");
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url; link.download = "asset_inventory_export.csv"; link.click();
  };

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div>
          <h2 className="text-lg font-semibold">سجل الأصول</h2>
          <p className="text-xs text-slate-400">{filtered.length} من أصل {assets.length}</p>
        </div>
        <div className="flex gap-2">
          <button onClick={exportCsv} className="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-blue-600 text-white text-xs font-medium hover:bg-blue-700"><Download size={13} /> تصدير CSV</button>
        </div>
      </div>

      <Card>
        <div className="flex flex-wrap gap-3 mb-4">
          <div className="relative flex-1 min-w-[200px]">
            <Search size={14} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400" />
            <input value={q} onChange={(e) => { setQ(e.target.value); setPageNum(1); }} placeholder="ابحث بالأصل أو الرقم التسلسلي أو المستخدم أو اسم الجهاز…" className="w-full pr-8 pl-3 py-2 text-sm rounded-lg bg-slate-100 dark:bg-slate-700/60 outline-none focus:ring-2 focus:ring-blue-500/30" />
          </div>
          <select value={dept} onChange={(e) => { setDept(e.target.value); setPageNum(1); }} className="px-3 py-2 text-sm rounded-lg bg-slate-100 dark:bg-slate-700/60 outline-none">
            {depts.map((d) => <option key={d} value={d}>{tr(d)}</option>)}
          </select>
          <select value={status} onChange={(e) => { setStatus(e.target.value); setPageNum(1); }} className="px-3 py-2 text-sm rounded-lg bg-slate-100 dark:bg-slate-700/60 outline-none">
            {statuses.map((s) => <option key={s} value={s}>{tr(s)}</option>)}
          </select>
          <select value={category} onChange={(e) => { setCategory(e.target.value); setPageNum(1); }} className="px-3 py-2 text-sm rounded-lg bg-slate-100 dark:bg-slate-700/60 outline-none">
            {categories.map((c) => <option key={c} value={c}>{tr(c)}</option>)}
          </select>
        </div>

        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead className="sticky top-0 bg-white dark:bg-slate-800">
              <tr className="text-right text-xs text-slate-400 border-b border-slate-100 dark:border-slate-700">
                {cols.map((c) => (
                  <th key={c.key} onClick={() => toggleSort(c.key)} className="py-2 pl-4 cursor-pointer select-none hover:text-slate-600">
                    {c.label} {sortKey === c.key && (sortDir === 1 ? "↑" : "↓")}
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {paged.map((a) => (
                <tr key={a["Asset ID"]} onClick={() => { setSelectedAsset(a); setDrawerTab("overview"); }} className="border-b border-slate-50 dark:border-slate-700/50 hover:bg-slate-50 dark:hover:bg-slate-700/40 cursor-pointer">
                  <td className="py-2 pl-4 font-mono text-xs text-slate-500">{a["Asset ID"]}</td>
                  <td className="py-2 pl-4 font-medium">{a["Asset Name"]}</td>
                  <td className="py-2 pl-4">{tr(a["Asset Category"])}</td>
                  <td className="py-2 pl-4 text-slate-500">{tr(a["Department"])}</td>
                  <td className="py-2 pl-4 text-slate-500">{a["Assigned User"]}</td>
                  <td className="py-2 pl-4"><Badge value={a["Asset Status"]} tones={STATUS_TONES} /></td>
                  <td className="py-2 pl-4"><Badge value={a["Compliance Status"]} tones={COMPLIANCE_TONES} /></td>
                  <td className="py-2 pl-4">
                    <span className="font-medium" style={{ color: healthColor(a["Asset Health Score"]) }}>{a["Asset Health Score"]}</span>
                  </td>
                </tr>
              ))}
              {paged.length === 0 && <tr><td colSpan={8}><EmptyState text="لا توجد أصول مطابقة لهذه المرشحات." /></td></tr>}
            </tbody>
          </table>
        </div>

        <div className="flex items-center justify-between mt-4 text-xs text-slate-500">
          <span>صفحة {pageNum} من {totalPages}</span>
          <div className="flex gap-1">
            <button disabled={pageNum === 1} onClick={() => setPageNum((p) => p - 1)} className="px-2.5 py-1 rounded-lg border border-slate-200 dark:border-slate-600 disabled:opacity-40">السابق</button>
            <button disabled={pageNum === totalPages} onClick={() => setPageNum((p) => p + 1)} className="px-2.5 py-1 rounded-lg border border-slate-200 dark:border-slate-600 disabled:opacity-40">التالي</button>
          </div>
        </div>
      </Card>

      {selectedAsset && <AssetDrawer asset={selectedAsset} onClose={() => setSelectedAsset(null)} tab={drawerTab} setTab={setDrawerTab} />}
    </div>
  );
}

/* ============================== LIFECYCLE PAGE ============================== */
function LifecyclePage({ assets, lifecycleFunnel }) {
  const total = assets.length;
  const activePct = Math.round((assets.filter((a) => a["Asset Status"] === "Active").length / (total || 1)) * 100);
  const maintPct = Math.round((assets.filter((a) => a["Asset Status"] === "Maintenance").length / (total || 1)) * 100);
  const retiredPct = Math.round((assets.filter((a) => a["Asset Status"] === "Retired").length / (total || 1)) * 100);

  const aging = useMemo(() => {
    const buckets = { "0–1 سنة": 0, "1–3 سنوات": 0, "3–5 سنوات": 0, "أكثر من 5 سنوات": 0 };
    assets.forEach((a) => {
      if (!a["Purchase Date"]) return;
      const years = (TODAY - new Date(a["Purchase Date"])) / (1000 * 60 * 60 * 24 * 365);
      if (years <= 1) buckets["0–1 سنة"]++;
      else if (years <= 3) buckets["1–3 سنوات"]++;
      else if (years <= 5) buckets["3–5 سنوات"]++;
      else buckets["أكثر من 5 سنوات"]++;
    });
    return Object.entries(buckets).map(([name, value]) => ({ name, value }));
  }, [assets]);

  const radialData = [
    { name: "نشط", value: activePct, fill: PALETTE.success },
    { name: "صيانة", value: maintPct, fill: PALETTE.warning },
    { name: "خارج الخدمة", value: retiredPct, fill: PALETTE.slate },
  ];

  return (
    <div className="space-y-4">
      <h2 className="text-lg font-semibold">دورة حياة الأصول</h2>
      <div className="grid lg:grid-cols-3 gap-4">
        <Card className="lg:col-span-1">
          <SectionTitle title="توزيع دورة الحياة" icon={RefreshCw} />
          <ResponsiveContainer width="100%" height={220}>
            <RadialBarChart innerRadius="30%" outerRadius="100%" data={radialData} startAngle={90} endAngle={-270}>
              <RadialBar dataKey="value" cornerRadius={8} background />
              <Legend iconSize={8} wrapperStyle={{ fontSize: 11 }} />
              <Tooltip contentStyle={{ borderRadius: 12, fontSize: 12 }} />
            </RadialBarChart>
          </ResponsiveContainer>
        </Card>
        <Card className="lg:col-span-2">
          <SectionTitle title="المخطط الزمني لدورة الحياة" subtitle="الشراء ← النشر ← الصيانة ← الاستبدال ← الإتلاف" icon={RefreshCw} />
          <div className="flex items-center justify-between mt-6 px-2">
            {["الشراء", "النشر", "الصيانة", "الاستبدال", "الإتلاف"].map((s, i, arr) => (
              <React.Fragment key={s}>
                <div className="flex flex-col items-center gap-2">
                  <div className="w-9 h-9 rounded-full flex items-center justify-center text-white text-xs font-semibold" style={{ backgroundColor: CATEGORY_COLORS[i] }}>{i + 1}</div>
                  <span className="text-[11px] text-slate-500 text-center w-16">{s}</span>
                </div>
                {i < arr.length - 1 && <div className="flex-1 h-0.5 bg-slate-200 dark:bg-slate-600 mx-1" />}
              </React.Fragment>
            ))}
          </div>
        </Card>
      </div>

      <Card>
        <SectionTitle title="أعمار الأصول" subtitle="التوزيع حسب عمر الأصل" icon={Clock} />
        <ResponsiveContainer width="100%" height={220}>
          <BarChart data={aging}>
            <CartesianGrid strokeDasharray="3 3" stroke="#e2e8f0" />
            <XAxis reversed dataKey="name" fontSize={11} />
            <YAxis orientation="right" fontSize={11} allowDecimals={false} />
            <Tooltip contentStyle={{ borderRadius: 12, fontSize: 12 }} />
            <Bar dataKey="value" radius={[6, 6, 0, 0]}>
              {aging.map((_, i) => <Cell key={i} fill={[PALETTE.success, "#3B82F6", PALETTE.warning, PALETTE.danger][i]} />)}
            </Bar>
          </BarChart>
        </ResponsiveContainer>
      </Card>

      <Card>
        <SectionTitle title="تفصيل مراحل دورة الحياة" icon={Boxes} />
        <div className="grid sm:grid-cols-5 gap-3">
          {lifecycleFunnel.map((s, i) => (
            <div key={s.stage} className="p-3 rounded-xl text-center" style={{ backgroundColor: `${CATEGORY_COLORS[i]}1A` }}>
              <div className="text-2xl font-semibold" style={{ color: CATEGORY_COLORS[i] }}>{s.count}</div>
              <div className="text-xs text-slate-500 mt-1">{tr(s.stage)}</div>
            </div>
          ))}
        </div>
      </Card>
    </div>
  );
}

/* ============================== WARRANTY PAGE ============================== */
function WarrantyPage({ warranty }) {
  const [sortDir, setSortDir] = useState(1);
  const active = warranty.filter((w) => w["Warranty Status"] === "Active").length;
  const expired = warranty.filter((w) => w["Warranty Status"] === "Expired").length;
  const d30 = warranty.filter((w) => w["Days Remaining"] >= 0 && w["Days Remaining"] <= 30).length;
  const d60 = warranty.filter((w) => w["Days Remaining"] > 30 && w["Days Remaining"] <= 60).length;
  const d90 = warranty.filter((w) => w["Days Remaining"] > 60 && w["Days Remaining"] <= 90).length;
  const amcExpiring = warranty.filter((w) => { const dd = daysUntil(w["AMC End"]); return dd != null && dd >= 0 && dd <= 60; }).length;

  const trend = useMemo(() => {
    const g = {};
    warranty.forEach((w) => { if (!w["Warranty End"]) return; const k = w["Warranty End"].slice(0, 7); g[k] = (g[k] || 0) + 1; });
    return Object.entries(g).sort(([a], [b]) => a.localeCompare(b)).slice(0, 14).map(([month, count]) => ({ month, count }));
  }, [warranty]);

  const deptRisk = useMemo(() => {
    const g = groupBy(warranty, "Department");
    return Object.entries(g).map(([name, items]) => ({ name, value: items.filter((i) => i["Warranty Status"] !== "Active").length })).sort((a, b) => b.value - a.value);
  }, [warranty]);

  const sorted = [...warranty].sort((a, b) => (a["Days Remaining"] - b["Days Remaining"]) * sortDir);

  return (
    <div className="space-y-4">
      <h2 className="text-lg font-semibold">لوحة الضمان وعقود الصيانة</h2>
      <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4">
        <KpiCard icon={CheckCircle2} label="ضمان ساري" value={active} tone="success" />
        <KpiCard icon={Clock} label="ينتهي خلال 30 يوماً" value={d30} tone="warning" />
        <KpiCard icon={Clock} label="ينتهي خلال 60 يوماً" value={d60} tone="warning" />
        <KpiCard icon={Clock} label="ينتهي خلال 90 يوماً" value={d90} tone="info" />
        <KpiCard icon={AlertTriangle} label="ضمان منتهي" value={expired} tone="danger" />
        <KpiCard icon={RefreshCw} label="عقود صيانة قاربت على الانتهاء" value={amcExpiring} tone="warning" />
      </div>

      <div className="grid lg:grid-cols-2 gap-4">
        <Card>
          <SectionTitle title="اتجاه الانتهاء الشهري" icon={TrendingUp} />
          <ResponsiveContainer width="100%" height={220}>
            <AreaChart data={trend}>
              <defs><linearGradient id="warrGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor={PALETTE.warning} stopOpacity={0.4} /><stop offset="95%" stopColor={PALETTE.warning} stopOpacity={0} /></linearGradient></defs>
              <CartesianGrid strokeDasharray="3 3" stroke="#e2e8f0" />
              <XAxis reversed dataKey="month" fontSize={10} />
              <YAxis orientation="right" fontSize={11} allowDecimals={false} />
              <Tooltip contentStyle={{ borderRadius: 12, fontSize: 12 }} />
              <Area type="monotone" dataKey="count" stroke={PALETTE.warning} fill="url(#warrGrad)" strokeWidth={2} />
            </AreaChart>
          </ResponsiveContainer>
        </Card>
        <Card>
          <SectionTitle title="مخاطر الضمان حسب القسم" subtitle="عدد الضمانات غير السارية" icon={Building2} />
          <ResponsiveContainer width="100%" height={220}>
            <BarChart data={trData(deptRisk)} layout="vertical" margin={{ right: 20 }}>
              <CartesianGrid strokeDasharray="3 3" horizontal={false} stroke="#e2e8f0" />
              <XAxis reversed type="number" fontSize={11} allowDecimals={false} />
              <YAxis orientation="right" type="category" dataKey="name" width={100} fontSize={10} />
              <Tooltip contentStyle={{ borderRadius: 12, fontSize: 12 }} />
              <Bar dataKey="value" fill={PALETTE.danger} radius={[6, 0, 0, 6]} barSize={12} />
            </BarChart>
          </ResponsiveContainer>
        </Card>

// 4 main domains · 28 subdomains · 108 main controls
const ECC_DOMAINS = {

};
const ECC_SUBDOMAINS = {
  "1-1": "استراتيجية الأمن السيبراني",
  "1-2": "إدارة الأمن السيبراني",

  "2-2": "إدارة هويات الدخول والصلاحيات",
  "2-3": "حماية الأنظمة وأجهزة معالجة المعلومات",
  "2-4": "حماية البريد الإلكتروني",
  "2-5": "إدارة أمن الشبكات",
  "2-6": "أمن الأجهزة المحمولة",
  "2-7": "حماية البيانات والمعلومات",
  "2-8": "التشفير",
  "2-9": "إدارة النسخ الاحتياطية",
  "2-10": "إدارة الثغرات",
  "2-11": "اختبار الاختراق",
  "2-12": "إدارة سجلات الأحداث ومراقبة الأمن السيبراني",
  "2-13": "إدارة حوادث وتهديدات الأمن السيبراني",
  "2-14": "الأمن المادي",
  "2-15": "حماية تطبيقات الويب",
  "3-1": "جوانب صمود الأمن السيبراني في إدارة استمرارية الأعمال",
  "4-1": "الأمن السيبراني المتعلق بالأطراف الخارجية",
  "4-2": "الأمن السيبراني المتعلق بالحوسبة السحابية والاستضافة",
};
const eccCode = (v) => (v == null ? "" : String(v).trim());
const eccDomainOf = (code) => eccCode(code).split("-")[0];
const eccLabel = (code) => { const c = eccCode(code); return ECC_SUBDOMAINS[c] ? `${c} ${ECC_SUBDOMAINS[c]}` : c || "—"; };

const IMPL_TONES = {
  Implemented: { bg: "bg-emerald-100 dark:bg-emerald-500/15", text: "text-emerald-700 dark:text-emerald-400" },
  "Partially Implemented": { bg: "bg-amber-100 dark:bg-amber-500/15", text: "text-amber-700 dark:text-amber-400" },
  "Not Implemented": { bg: "bg-red-100 dark:bg-red-500/15", text: "text-red-700 dark:text-red-400" },
  "Not Applicable": { bg: "bg-slate-200 dark:bg-slate-600/30", text: "text-slate-600 dark:text-slate-300" },
};
const IMPL_COLORS = { Implemented: PALETTE.success, "Partially Implemented": PALETTE.warning, "Not Implemented": PALETTE.danger, "Not Applicable": PALETTE.slate };
const CLASS_ORDER = ["Top Secret", "Secret", "Restricted", "Public"];
const CLASS_COLORS = { "Top Secret": "#B91C1C", Secret: "#F97316", Restricted: "#2563EB", Public: "#10B981" };

// Compliance % = implemented (1) + partially implemented (0.5) over applicable controls
const eccCompliance = (rows) => {
  const applicable = rows.filter((r) => r["Implementation Status"] !== "Not Applicable");
  if (!applicable.length) return 0;
  const score = applicable.reduce((s, r) => s + (r["Implementation Status"] === "Implemented" ? 1 : r["Implementation Status"] === "Partially Implemented" ? 0.5 : 0), 0);
  return Math.round((score / applicable.length) * 100);
};

function NcaPage({ nca }) {
  const [domainFilter, setDomainFilter] = useState("All");
  const [statusFilter, setStatusFilter] = useState("All");
  const [q, setQ] = useState("");

  const compliancePct = eccCompliance(nca);
  const notImpl = nca.filter((i) => i["Implementation Status"] === "Not Implemented").length;
  const partial = nca.filter((i) => i["Implementation Status"] === "Partially Implemented").length;
  const secret = nca.filter((i) => i["Data Classification"] === "Top Secret" || i["Data Classification"] === "Secret").length;
  const critical = nca.filter((i) => i["Risk Rating"] === "Critical").length;

  const statusCounts = useMemo(() => {
    const g = groupBy(nca, "Implementation Status");
    return ["Implemented", "Partially Implemented", "Not Implemented", "Not Applicable"]
      .map((name) => ({ name, value: (g[name] || []).length })).filter((d) => d.value > 0);
  }, [nca]);

  const domainCompliance = useMemo(() => Object.keys(ECC_DOMAINS).map((d) => {
    const rows = nca.filter((i) => eccDomainOf(i["ECC Subdomain"]) === d);
    return { name: `${d}. ${ECC_DOMAINS[d]}`, short: `المكوّن ${d}`, value: eccCompliance(rows), count: rows.length };
  }).filter((d) => d.count > 0), [nca]);

  const classCounts = useMemo(() => {
    const g = groupBy(nca, "Data Classification");
    return CLASS_ORDER.map((name) => ({ name, value: (g[name] || []).length })).filter((d) => d.value > 0);
  }, [nca]);

  const riskCounts = useMemo(() => {
    const g = groupBy(nca, "Risk Rating");
    return ["Critical", "High", "Medium", "Low"].map((name) => ({ name, value: (g[name] || []).length })).filter((d) => d.value > 0);
  }, [nca]);

  const subdomainGaps = useMemo(() => {
    const g = groupBy(nca, "ECC Subdomain");
    return Object.entries(g).map(([code, rows]) => ({
      name: eccLabel(code),
      gaps: rows.filter((r) => r["Implementation Status"] === "Not Implemented" || r["Implementation Status"] === "Partially Implemented").length,
      total: rows.length,
    })).sort((a, b) => b.gaps - a.gaps).slice(0, 8);
  }, [nca]);

  const filtered = useMemo(() => {
    const s = normDigits(q).trim().toLowerCase();
    return nca.filter((i) =>
      (domainFilter === "All" || eccDomainOf(i["ECC Subdomain"]) === domainFilter) &&
      (statusFilter === "All" || i["Implementation Status"] === statusFilter) &&
      (!s || [i["Asset ID"], i["Information Asset"], i["Asset Owner"], i["Control Owner"], eccLabel(i["ECC Subdomain"])].some((f) => String(f ?? "").toLowerCase().includes(s)))
    );
  }, [nca, domainFilter, statusFilter, q]);

  const RISK_COLORS = { Critical: PALETTE.danger, High: "#F97316", Medium: PALETTE.warning, Low: PALETTE.success };
  const first = (v) => (v ? String(v)[0] : "-");

  return (
    <div className="space-y-4">
      <div>
        <h2 className="text-lg font-semibold flex items-center gap-2"><ShieldCheck size={18} /> الضوابط الأساسية للأمن السيبراني (ECC-2:2024)</h2>
        <p className="text-slate-400 text-xs mt-1">الهيئة الوطنية للأمن السيبراني — المملكة العربية السعودية · 4 مكونات أساسية · 28 مكوناً فرعياً · 108 ضوابط أساسية</p>
      </div>
      <div className="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-4">
        <KpiCard icon={FileCheck2} label="أصول المعلومات المقيّمة" value={nca.length} tone="primary" />
        <KpiCard icon={CheckCircle2} label="نسبة الالتزام بالضوابط" value={compliancePct} suffix="%" tone="success" trendLabel="منفّذ = 1 · منفّذ جزئياً = 0.5" />
        <KpiCard icon={ShieldAlert} label="ضوابط غير منفّذة" value={notImpl} tone="danger" />
        <KpiCard icon={AlertTriangle} label="ضوابط منفّذة جزئياً" value={partial} tone="warning" />
        <KpiCard icon={Lock} label="بيانات سري / سري للغاية" value={secret} tone="warning" />
        <KpiCard icon={AlertTriangle} label="أصول ذات مخاطر حرجة" value={critical} tone="danger" />
      </div>

      <div className="grid lg:grid-cols-3 gap-4">
        <Card>
          <SectionTitle title="حالة تطبيق الضوابط" icon={CheckCircle2} />

            <PieChart>
              <Pie data={trData(statusCounts)} dataKey="value" nameKey="name" innerRadius={50} outerRadius={82} paddingAngle={2}>

              <Tooltip contentStyle={{ borderRadius: 12, fontSize: 12 }} />
              <Legend iconSize={8} wrapperStyle={{ fontSize: 10 }} />
            </PieChart>

        </Card>
        <Card>
          <SectionTitle title="الالتزام حسب المكوّن الأساسي" subtitle="نسبة الالتزام لكل مكوّن من مكونات ECC" icon={ShieldCheck} />
          <div className="space-y-3 mt-2">
            {domainCompliance.length === 0 && <div className="text-xs text-slate-400">لا توجد بيانات</div>}
            {domainCompliance.map((d) => (
              <div key={d.name}>
                <div className="flex justify-between text-xs mb-1 gap-2"><span className="text-slate-600 dark:text-slate-300 truncate" title={d.name}>{d.name}</span><span className="font-semibold shrink-0">{d.value}%</span></div>
                <ProgressBar value={d.value} color={d.value >= 80 ? PALETTE.success : d.value >= 60 ? PALETTE.warning : PALETTE.danger} />
              </div>

          </div>
        </Card>
        <Card>
          <SectionTitle title="تصنيف البيانات" subtitle="وفق مستويات مكتب إدارة البيانات الوطنية" icon={Lock} />

            <PieChart>
              <Pie data={trData(classCounts)} dataKey="value" nameKey="name" innerRadius={50} outerRadius={82} paddingAngle={2}>

        <div className="flex flex-wrap items-center justify-between gap-3 mb-4">

          <div className="flex flex-wrap gap-2">
            <div className="relative">

              <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="ابحث بالأصل أو المالك أو الضابط…" className="pr-8 pl-3 py-2 rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-800 text-xs w-56" />

function ReportsPage({ assets, nca = [] }) {
  const reports = [
    { name: "الملخص التنفيذي", icon: FileBarChart, desc: "نظرة عامة على مؤشرات الأداء الرئيسية لتقارير الإدارة العليا." },
    { name: "تقرير الأقسام", icon: Building2, desc: "تفصيل الأصول والقيمة والامتثال لكل قسم." },
    { name: "تقرير الضمان", icon: Clock, desc: "جدول انتهاء الضمان وعقود الصيانة مع أولوية التجديد." },
    { name: "تقرير الامتثال", icon: ShieldCheck, desc: "تغطية الضوابط الأمنية والأصول غير الممتثلة." },
    { name: "تقرير البرمجيات", icon: Package, desc: "حالة التراخيص ودورة دعم البرمجيات المثبّتة." },
    { name: "تقرير الشبكة", icon: Network, desc: "سجل الجدران النارية والموجّهات والمبدّلات ونقاط الوصول." },
    { name: "تقرير الالتزام بضوابط NCA", icon: FileCheck2, desc: "حالة تطبيق الضوابط الأساسية للأمن السيبراني (ECC-2:2024) لكل أصل.", rows: nca },
  ];

  const exportCsv = (name, data = assets) => {
    if (!data.length) return;
    const headers = Object.keys(data[0]);
    const rows = data.map((a) => headers.map((h) => `"${a[h] ?? ""}"`).join(","));
    const csv = [headers.join(","), ...rows].join("\n");
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url; link.download = `${name.replace(/\s+/g, "_")}.csv`; link.click();
  };

  return (
    <div className="space-y-4">
      <h2 className="text-lg font-semibold">مركز التقارير</h2>
      <p className="text-sm text-slate-400 -mt-2">أنشئ التقارير مباشرةً من سجل الأصول الحالي.</p>
      <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
        {reports.map((r) => (
          <Card key={r.name}>
            <div className="w-10 h-10 rounded-xl bg-blue-50 dark:bg-blue-500/10 text-blue-600 dark:text-blue-400 flex items-center justify-center mb-3"><r.icon size={18} /></div>
            <div className="font-medium text-sm mb-1">{r.name}</div>
            <p className="text-xs text-slate-400 mb-4">{r.desc}</p>
            <button onClick={() => exportCsv(r.name, r.rows || assets)} className="w-full flex items-center justify-center gap-1.5 px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-600 text-xs font-medium hover:bg-slate-50 dark:hover:bg-slate-700/60">
              <Download size={13} /> تصدير CSV
            </button>
          </Card>
        ))}
      </div>
    </div>
  );
}

/* ============================== ARABIC DIGITS (display only) ============================== */
// Numbers are stored and calculated in Western digits; only what appears on screen is converted to
// Arabic-Indic digits (٠١٢٣٤٥٦٧٨٩). Identifiers stay as they are: asset IDs, hostnames, IPs, serials,
// model names, software versions, ECC control codes (e.g. 2-1), e-mails and file names.
const USE_ARABIC_DIGITS = true;
const AR_DIGITS = "٠١٢٣٤٥٦٧٨٩";
const LATIN_LETTER = /[A-Za-z]/;
const TOKEN_RE = /[A-Za-z0-9.,%\/:_\-]+/g;

function arabizeText(s) {
  if (!s || !/[0-9]/.test(s)) return s;
  return s.replace(TOKEN_RE, (tok, start) => {
    if (!/[0-9]/.test(tok)) return tok;                       // no digits
    if (LATIN_LETTER.test(tok)) return tok;                    // AST-0001, i7, ECC-2:2024, v8.7, SN123…
    if ((tok.match(/\./g) || []).length >= 2) return tok;      // IP addresses, versions like 7.0.19
    if (/[0-9]-[0-9]/.test(tok)) return tok;                   // codes like 2-1, raw ISO dates
    const before = s.slice(0, start);
    const after = s.slice(start + tok.length);
    if (tok[0] === "-" && /\p{L}$/u.test(before)) return tok;  // name suffixes like حاسب محمول-0001
    const prevWord = (before.match(/(\S+)\s*$/) || [])[1] || "";
    const nextWord = (after.match(/^\s*(\S+)/) || [])[1] || "";
    if (LATIN_LETTER.test(prevWord.slice(-1)) || LATIN_LETTER.test(nextWord[0] || "")) return tok; // Windows 11, Microsoft 365, 22.04 LTS
    return tok
      .replace(/([0-9]),(?=[0-9])/g, "$1٬")
      .replace(/([0-9])\.(?=[0-9])/g, "$1٫")
      .replace(/%/g, "٪")
      .replace(/[0-9]/g, (d) => AR_DIGITS[d]);
  });
}

// Lets people type either Arabic or Western digits in the search boxes
const normDigits = (s) => String(s ?? "").replace(/[٠-٩]/g, (d) => String(AR_DIGITS.indexOf(d))).replace(/٫/g, ".").replace(/٬/g, ",");

const SKIP_SELECTOR = "script,style,textarea,input,[data-latin],.font-mono";
function arabizeNode(node) {
  if (node.nodeType === 3) {
    const p = node.parentElement;
    if (!p || p.closest(SKIP_SELECTOR)) return;
    const next = arabizeText(node.nodeValue);
    if (next !== node.nodeValue) node.nodeValue = next;
  } else if (node.nodeType === 1) {
    if (node.closest(SKIP_SELECTOR)) return;
    const walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT);
    let t; while ((t = walker.nextNode())) arabizeNode(t);
  }
}
function startArabicDigits(root) {
  if (!USE_ARABIC_DIGITS) return;
  arabizeNode(root);
  new MutationObserver((muts) => {
    for (const m of muts) {
      if (m.type === "characterData") arabizeNode(m.target);
      else m.addedNodes.forEach(arabizeNode);
    }
  }).observe(root, { subtree: true, childList: true, characterData: true });
}

const rootEl = document.getElementById("root");
createRoot(rootEl).render(<App />);
startArabicDigits(document.body);

</script>
